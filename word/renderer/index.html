<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오골계 워드</title>
<link rel="icon" type="image/png" href="/assets/icons/word-folder-blue-to-sky.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="titlebar"><img src="/assets/icons/word-folder-blue-to-sky.png" alt=""><span id="app-title">오골계 워드</span></header>


<main id="work">
  <section id="main-pane" class="pane">
    <div id="main-editor" class="pane-body"></div>
  </section>
  <div id="splitter" hidden></div>
  <section id="sub-pane" class="pane" hidden>
    <div id="sub-body" class="pane-body">
      <div id="sub-tabs-shell">
        <div id="sub-tabs" role="tablist" aria-label="서브뷰 탭"></div>
        <span class="spacer"></span>
        <span id="status" class="status"></span>
        <button id="sub-close" title="서브뷰 전체 닫기">✕</button>
      </div>
      <div id="sub-drop" class="drop">PDF 또는 HWP/HWPX 파일을 여기에 끌어다 놓거나<br>위쪽 서브뷰 메뉴에서 여세요.</div>
    </div>
  </section>
  <div id="drag-shield" hidden></div>
</main>
<input type="file" id="picker" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
